# 共用前綴：影片模式貼連結＋解析。用 runFlow env 傳 URL，不可單獨跑。
# Maestro quirks：inputText 只吃 ASCII；tapOn 是 regex 全比對，中文用精確全文。
appId: com.openmedia.downloader
---
# API 29 WebView 第一 tap 只聚焦 WebView 本體，第二 tap 才進輸入框；35 單 tap 即行，
# 雙 tap 兩邊都安全。
- tapOn: 貼上影片連結
- tapOn: 貼上影片連結
- inputText: "${URL}"
- hideKeyboard
# 收鍵盤時 layout 位移：等動畫結束再點，否則 tap 座標是舊的（API 29 必 miss）。
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: 解析
# API 29 WebView 第一 tap 只聚焦不觸發，第二 tap 才點到；35 是一次就中，
# 第二 tap 找不到按鈕屬正常，用 optional 跳過。
- tapOn:
    text: 解析
    optional: true
