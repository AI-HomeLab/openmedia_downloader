# YouTube 分離抓取＋合併全環：解析 → 選畫質（分離式，自動合併）→ 下載 → 完成
# 前提：YtDlpEngine wheel overlay（否則 YouTube 直連 403）
# 素材是自家 Shorts（3 秒）：畫質梯跟長片不同（256/426/640/854/1080/1280/1920）。
# 畫質用「前綴 regex」選（檔名大小會浮動，認大小必 miss；tapOn 的 text 就是 regex）。
# SABR 抽獎保險保留（由小到大 optional 連點，最後命中者留下），但每次滾動後
# 必須等動畫結束再點——WebView 滾動中 a11y 邊界是 stale 的，曾誤觸 sticky CTA
# 在 picked=0 預設下直接開下最高畫質。scroll 與 tap 分開，settle 後再點。
appId: com.openmedia.downloader
---
- runFlow:
    file: ./_common/launch.yaml
- runFlow:
    file: ./_common/resolve-video.yaml
    env:
      URL: "https://www.youtube.com/shorts/tE0usg6bjJQ"
- extendedWaitUntil:
    visible: "test video"
    timeout: 120000
- scrollUntilVisible:
    element: "256p mp4.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "256p mp4.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element: "640p mp4.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "640p mp4.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element: "1080p mp4.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "1080p mp4.*"
# 還在解析畫面才點下載（防誤觸開下後 radios 消失、後面全歪）。
- assertVisible: 下載影片
- tapOn: 下載影片
- extendedWaitUntil:
    visible: "完成.*"
    timeout: 420000
