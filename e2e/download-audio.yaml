# 音檔全環：切音檔 → 貼連結 → 解析 → 下載 → 完成
appId: com.openmedia.downloader
---
- launchApp:
    clearState: true
- assertVisible: OpenMedia
- tapOn: 音檔
- tapOn: 貼上影片連結
- inputText: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
- hideKeyboard
- tapOn: 解析
- assertVisible: SoundHelix-Song-1
- tapOn: 下載
- extendedWaitUntil:
    visible: "完成.*"
    timeout: 180000
