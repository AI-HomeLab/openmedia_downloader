# 音檔全環：切音檔 → 貼連結 → 解析 → 下載 → 完成
appId: com.openmedia.downloader
---
- runFlow:
    file: ./_common/launch.yaml
- runFlow:
    file: ./_common/resolve-audio.yaml
    env:
      URL: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
- assertVisible: SoundHelix-Song-1
- tapOn: 下載
- extendedWaitUntil:
    visible: "完成.*"
    timeout: 600000
