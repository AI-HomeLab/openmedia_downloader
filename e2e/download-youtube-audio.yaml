# YouTube→mp3 全環：切音檔 → 貼 YouTube 連結 → 解析 → 下載（bestaudio＋轉 mp3）→ 完成
# 前提：YtDlpEngine wheel overlay（否則 YouTube 直連 403）
# 音檔模式無畫質清單，不需選項不斷言大小（檔名由轉檔決定，flow 只認完成＋e2e.sh 認檔）。
appId: com.openmedia.downloader
---
- launchApp:
    clearState: true
- assertVisible: OpenMedia
- tapOn: 音檔
- tapOn: 貼上影片連結
- inputText: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
- hideKeyboard
- tapOn: 解析
- extendedWaitUntil:
    visible: "Big Buck Bunny.*"
    timeout: 120000
- tapOn: 下載
- extendedWaitUntil:
    visible: "完成.*"
    timeout: 300000
