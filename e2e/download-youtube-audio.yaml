# YouTube→mp3 全環：貼 Shorts 連結 → 解析 → 下載音檔（bestaudio＋轉 mp3）→ 完成
# 前提：YtDlpEngine wheel overlay（否則 YouTube 直連 403）
# 音檔走 bestaudio 不用選畫質（檔名由轉檔決定，flow 只認完成＋e2e.sh 認檔）。
appId: com.openmedia.downloader
---
- runFlow:
    file: ./_common/launch.yaml
- runFlow:
    file: ./_common/resolve-audio.yaml
    env:
      URL: "https://www.youtube.com/shorts/tE0usg6bjJQ"
- extendedWaitUntil:
    visible: "test video"
    timeout: 120000
- tapOn: 下載音檔
- extendedWaitUntil:
    visible: "完成.*"
    timeout: 300000
