# Debug 發版：手動觸發即產 debug APK 並上傳到 GitHub Releases。
# 給「還沒配簽章 secret 就想裝到手機測」用：debug 包自動帶 debug 簽章，可直接安裝；
# 正式對外一律走 release.yml（v* tag＋正式簽章）。
name: debug-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自動用最新 v* 版號＋-debug，例如 v0.1.0-debug）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  debug-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4
        with:
          # 取版號要看到舊 tags（預設淺抓沒有祖先，describe 會掉回 v0.0.0）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages (compileSdk 36＋build-tools 35.0.0)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      - name: Assemble debug APK（debug 簽章自動帶，可直接安裝）
        run: pnpm android:build

      - name: Resolve tag（預設最新正式版＋-debug）
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
          echo "value=${base}-debug" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Releases（prerelease：僅測試用）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
