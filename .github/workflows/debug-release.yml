# Debug 發版：手動觸發即產 debug APK 並上傳到 GitHub Releases。
# 給「還沒配簽章 secret 就想裝到手機測」用：debug 包自動帶 debug 簽章，可直接安裝；
# 正式對外一律走 release.yml（v* tag＋正式簽章）。
name: debug-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自動 debug-YYYYMMDD-<run_number>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  debug-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages (compileSdk 36＋build-tools 35.0.0)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      - name: Assemble debug APK（debug 簽章自動帶，可直接安裝）
        run: pnpm android:build

      - name: Upload to GitHub Releases（prerelease：僅測試用）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('debug-{0}', github.run_number) }}
          name: ${{ inputs.tag != '' && inputs.tag || format('debug-{0}', github.run_number) }}
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
