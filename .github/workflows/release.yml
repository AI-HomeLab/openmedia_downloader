# 簽章發版（ticket 02）：打 v* tag 即產 signed AAB＋APK 並上傳到 GitHub Releases。
# 私鑰只活在 Secrets＋runner 暫存：ANDROID_KEYSTORE_BASE64／KEYSTORE_PASSWORD／
# KEY_ALIAS／KEY_PASSWORD（擁有者去 GitHub 網頁填，見 ticket 02）。
# 沒配 secret 也能跑全鏈（產物為 unsigned，僅驗證用）。
# Prerelease：tag 帶 -debug／-alpha／-beta／-rc／-preview 後綴即標 prerelease
#（取代已刪除的 debug-release.yml：要可安裝的測試包就打 vX.Y.Z-debug）。
# Release 內文自動抓「與上個 release 的差異」：合併的 PR＋commit 第一句。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      # secrets 不能直接進 if 運算式，先在 env 轉成普通字串再比。
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 差異訊息要看到上個 tag（預設淺抓沒有祖先，describe 直接炸）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages (compileSdk 36＋build-tools 35.0.0)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      - name: Decode keystore (有配 secret 才做)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: pnpm android:release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Bundle release AAB
        run: bash scripts/gradle.sh bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Report signing state
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then echo "signed build"; else echo "unsigned build (no secrets configured)"; fi

      - name: Resolve flags＋差異訊息（與上個 release 比）
        id: notes
        run: |
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            *-debug|*-alpha*|*-beta*|*-rc*|*-preview*) PRE=true ;;
            *) PRE=false ;;
          esac
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          # 上個 tag：本 tag 父節點往回找（首版就沒有，內文寫首個版本）。
          PREV="$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)"
          {
            echo "## 與 ${PREV:-（首個版本）} 的差異"
            echo
            echo "### PR"
            if [ -n "$PREV" ]; then
              RANGE="$(git log --format=%H "$PREV..$REF" | tr '\n' ' ')"
              FOUND=0
              while IFS="$(printf '\t')" read -r num author url oid title; do
                case " $RANGE " in
                  *" $oid "*) echo "- #$num $title (@$author) $url"; FOUND=1 ;;
                esac
              done < <(gh pr list --state merged --base main --limit 50 \
                --json number,title,author,url,mergeCommit \
                --jq '.[] | "\(.number)\t\(.author.login)\t\(.url)\t\(.mergeCommit.oid)\t\(.title)"' 2>/dev/null || true)
              [ "$FOUND" -eq 0 ] && echo "（無）"
              echo
              echo "### Commits"
              git log --format='- %h %s' "$PREV..$REF"
            else
              echo "（無）"
              echo
              echo "### Commits"
              echo "（無）"
            fi
          } > /tmp/release-notes.md
          echo "body=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.notes.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.body }}
          # unsigned 時檔名是 app-release-unsigned.apk，有簽章才是 app-release.apk。
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
