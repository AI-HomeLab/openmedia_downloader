# 全矩陣驗收（ticket 03）：connected（API 29／33／35）＋Maestro e2e。
# 觸發策略（不瘋狂維護）：
# - push 到 main＝有更新＝一定跑（驗本次變更沒炸站外鏈路）；
# - 排程每週一次＝沒更新也跑（驗 YouTube／X／Bilibili 站方沒改版）；
# - 手動 dispatch 隨時可跑。站外抖動只告警，永不擋 PR。
name: nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    # 模擬器若真卡死，不要燒 6 小時預設上限。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 35 跑全套；29/33 只跑一條冒煙（resolve→下載→合併），證明 API 相容即可。
        # 全量 connected 在三個 API 上又慢又容易一起卡住，之前 0/17 卡死就是這樣。
        include:
          - api: 29
            connected_filter: -Pandroid.testInstrumentationRunnerArguments.class=com.openmedia.downloader.YoutubeSplitMergeTest
            run_e2e: false
          - api: 33
            connected_filter: -Pandroid.testInstrumentationRunnerArguments.class=com.openmedia.downloader.YoutubeSplitMergeTest
            run_e2e: false
          - api: 35
            connected_filter: ''
            run_e2e: true
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platforms;android-${{ matrix.api }}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      # KVM 不存在時模擬器會掉進純軟體模擬（慢到 0/17 卡死）：先驗，有問題立刻紅，
      # 不要燒 90 分鐘才發現。
      - name: Check KVM acceleration
        run: |
          egrep -c '^(flags|Features).*(vmx|svm)' /proc/cpuinfo || true
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Connected tests on API ${{ matrix.api }} + e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # 舊 API（29）在新 emulator 下開機易卡：關快照/音效/動畫，拉記憶體。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            bash scripts/gradle.sh connectedDebugAndroidTest ${{ matrix.connected_filter }} -x :capacitor-cordova-android-plugins:connectedDebugAndroidTest
            if [ "${{ matrix.run_e2e }}" = "true" ]; then
              bash scripts/gradle.sh assembleDebug
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk
              curl -fsSL "https://get.maestro.mobile.dev" | bash
              export PATH="$HOME/.maestro/bin:$PATH"
              bash scripts/e2e.sh
            fi
