# 全矩陣驗收（ticket 03）：connected（API 29／33／35）＋Maestro e2e。
# 觸發策略（不瘋狂維護）：
# - push 到 main＝有更新＝一定跑（驗本次變更沒炸站外鏈路）；
# - 排程每週一次＝沒更新也跑（驗 YouTube／X／Bilibili 站方沒改版）；
# - 手動 dispatch 隨時可跑。站外抖動只告警，永不擋 PR。
name: nightly

# 同時間只跑一份 nightly（手動＋push 撞車時，新的砍掉舊的，省分钟數）。
concurrency:
  group: nightly
  cancel-in-progress: true

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    # 模擬器若真卡死，不要燒 6 小時預設上限。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 只跑 29：省矩陣麻煩。全量 connected＋e2e 都在同一台驗。
        include:
          - api: 29
            connected_filter: ''
            run_e2e: true
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platforms;android-${{ matrix.api }}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      # runner 有 KVM 硬體但 runner 使用者不在 kvm 群組（root:kvm 660）：
      # 沒這條，模擬器掉進純軟體模擬，API 29 開不了機、33/35 卡在 0/17。
      # （本地 .tools 遇過同樣問題，用 sg 繞；CI 上 sudo 免密碼，直接修 udev。）
      - name: Enable KVM for runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Connected tests on API ${{ matrix.api }} + e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # 舊 API（29）在新 emulator 下開機易卡：關快照/音效/動畫，拉記憶體。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            set +e
            bash scripts/gradle.sh connectedDebugAndroidTest ${{ matrix.connected_filter }} -x :capacitor-cordova-android-plugins:connectedDebugAndroidTest
            CT=$?
            ET=0
            if [ "${{ matrix.run_e2e }}" = "true" ]; then
              bash scripts/gradle.sh assembleDebug
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk
              curl -fsSL "https://get.maestro.mobile.dev" | bash
              export PATH="$HOME/.maestro/bin:$PATH"
              bash scripts/e2e.sh
              ET=$?
            fi
            adb logcat -d > /tmp/logcat-api-${{ matrix.api }}.txt || true
            if [ "$CT" -ne 0 ]; then exit "$CT"; fi
            exit "$ET"
      # 跑完（無論成敗）把裝置 log 撈回來：resolve 這類失敗只剩 logcat 有根因。
      - name: Upload device logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api }}
          path: /tmp/logcat-api-${{ matrix.api }}.txt
