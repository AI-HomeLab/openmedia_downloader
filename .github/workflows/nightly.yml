# 全矩陣驗收（ticket 03）：connected（API 29／33／35）＋Maestro e2e。
# 觸發策略（不瘋狂維護）：
# - push 到 main＝有更新＝一定跑（驗本次變更沒炸站外鏈路）；
# - 排程每週一次＝沒更新也跑（驗 YouTube／X／Bilibili 站方沒改版）；
# - 手動 dispatch 隨時可跑。站外抖動只告警，永不擋 PR。
name: nightly

# 同時間只跑一份 nightly（手動＋push 撞車時，新的砍掉舊的，省分钟數）。
concurrency:
  group: nightly
  cancel-in-progress: true

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  matrix:
    # 家用 x86_64 自架機（GTX 970）：KVM＋家用出口 IP，模擬器原生跑、站外不擋。
    runs-on: [self-hosted, home-gtx970]
    # 模擬器若真卡死，不要燒 6 小時預設上限。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # API 29 模擬器的系統 WebView 凍結在 Chrome 74（2019），React 19 的
        # onClick 點不動（typing/label 正常；真機 WebView 會經 Play 更新，無此問題）。
        # 所以：29 只跑免點擊的 connected 冒煙；e2e 全放 35（現代 WebView）。
        include:
          - api: 29
            connected_filter: -Pandroid.testInstrumentationRunnerArguments.class=com.openmedia.downloader.YoutubeSplitMergeTest
            run_e2e: false
          - api: 35
            connected_filter: ''
            run_e2e: true
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android cmdline-tools (自架機無預裝 SDK 時自裝)
        # 自架機是持久的：裝到 $HOME/android-sdk，裝一次就留著；
        # 後續 run 的 sdkmanager 會跳過已裝的包，不再重複下載傷磁碟。
        # （GH-hosted 跑 ci.yml 那條不走這裡，不受影響。）
        run: |
          if command -v sdkmanager > /dev/null 2>&1; then exit 0; fi
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "platforms;android-${{ matrix.api }}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web static export
        run: pnpm build

      - name: Sync web into android
        run: pnpm cap:sync

      # KVM：先看能不能直接用；不行且有免密 sudo 才寫 udev（家用機 sudo 要密碼，
      # 參考本地 sg 繞法——CI 上沒法互動，直接放行並告警，不擋後面步驟）。
      # 一勞永逸：在該機器跑 `sudo usermod -aG kvm $USER` 後重登 runner。
      - name: Enable KVM for runner user (best-effort)
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "KVM already accessible"; exit 0; fi
          if sudo -n true 2>/dev/null; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          else
            echo "WARNING: no passwordless sudo; KVM fix skipped (add runner user to kvm group on host)"
          fi
          ls -l /dev/kvm || true

      - name: Connected tests on API ${{ matrix.api }} + e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # 舊 API（29）在新 emulator 下開機易卡：關快照/音效/動畫，拉記憶體。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash scripts/nightly-run.sh ${{ matrix.api }} "${{ matrix.connected_filter }}" ${{ matrix.run_e2e }}
      # 跑完（無論成敗）把裝置 log 撈回來：resolve 這類失敗只剩 logcat 有根因。
      - name: Upload device logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api }}
          path: /tmp/logcat-api-${{ matrix.api }}.txt
