# PR 擋門：JS 測試＋Android 單測＋debug 打包（ticket 01）。
# 全用 runner 官方工具鏈，不用 repo 內 .tools/；connected／e2e 在 nightly。
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # 合併文件類 PR 不重編一次（PR 上已經驗過）：只在碰到程式／依賴／CI 本體時跑。
    paths:
      - 'android/**'
      - 'apps/web/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'capacitor.config.ts'
      - '.github/workflows/ci.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      # 讓 scripts/gradle.sh 用 runner 的家目錄快取（官方 setup-gradle action 才吃得到）。
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm 版號由 packageManager pin)
        run: corepack enable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 自帶 Android SDK（ANDROID_HOME 已設）；setup-android 會因內建
      # 舊 'tools' 包名炸掉，直接用預裝的，只補要用的包。
      - name: Install SDK packages (compileSdk 36＋build-tools 35.0.0)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Web tests
        run: pnpm test

      - name: Web static export
        run: pnpm build

      - name: Sync web into android (本地順序固定：沒 sync 就沒有 cordova plugins 目錄)
        run: pnpm cap:sync

      - name: Android unit tests
        run: pnpm android:test

      - name: Assemble debug APK
        run: pnpm android:build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
